name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Dominio custom kodexis.co → base "/".
          # Override opcional vía Variable de repo (nunca Secrets aquí salvo la key de formulario).
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          # Secret: no se imprime en logs. Si está vacío, PQRS usa mailto.
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
        run: |
          set -euo pipefail
          export VITE_BASE_PATH="${VITE_BASE_PATH:-/}"
          export VITE_CONTACT_EMAIL="${VITE_CONTACT_EMAIL:-contacto@kodexis.co}"
          echo "Building with VITE_BASE_PATH=${VITE_BASE_PATH}"
          echo "VITE_CONTACT_EMAIL is set: $( [ -n "${VITE_CONTACT_EMAIL}" ] && echo yes || echo no )"
          echo "WEB3FORMS secret present: $( [ -n "${VITE_WEB3FORMS_ACCESS_KEY:-}" ] && echo yes || echo no )"
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
